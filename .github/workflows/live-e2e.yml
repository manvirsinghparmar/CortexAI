name: Live E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: live-e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortexai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cortex -d cortexai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_LIVE_ENABLED: "true"
      E2E_LOAD_ROOT_DOTENV: "false"
      E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
      E2E_DATABASE_URL: postgresql+psycopg://cortex:cortex@127.0.0.1:5432/cortexai
      PG_DATABASE_URL: postgresql://cortex:cortex@127.0.0.1:5432/cortexai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install E2E dependencies
        run: npm install
        working-directory: e2e

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database schema
        run: |
          psql "$PG_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema_public_snapshot.sql
          for migration in db/migrations/*.sql; do
            psql "$PG_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run live E2E suite
        run: npm run test
        working-directory: e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.runtime
          if-no-files-found: ignore
