name: Live E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read
  checks: write

jobs:
  live-e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: live-e2e
    env:
      E2E_LIVE_ENABLED: "true"
      E2E_LOAD_ROOT_DOTENV: "false"
      E2E_SERVER_START_TIMEOUT_MS: "150000"
      E2E_DISCOVERY_TIMEOUT_MS: "60000"
      E2E_FRONTEND_READY_TIMEOUT_MS: "45000"
      E2E_FIRST_CONTENT_TIMEOUT_MS: "90000"
      E2E_ASK_TIMEOUT_MS: "300000"
      E2E_COMPARE_TIMEOUT_MS: "420000"
      E2E_HISTORY_RESTORE_TIMEOUT_MS: "30000"
      E2E_FALLBACK_TIMEOUT_MS: "180000"
      E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
      E2E_DATABASE_URL: postgresql+psycopg://postgres:cortex@127.0.0.1:5432/cortexai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install E2E dependencies
        run: npm install
        working-directory: e2e

      - name: Validate required live secrets
        run: |
          $required = @(
            "E2E_API_KEY",
            "OPENAI_API_KEY",
            "GOOGLE_GEMINI_API_KEY",
            "ANTHROPIC_API_KEY",
            "GROK_API_KEY",
            "DEEPSEEK_API_KEY"
          )

          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name" -ErrorAction SilentlyContinue).Value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error ("Missing required GitHub secrets: " + ($missing -join ", "))
            exit 1
          }

      - name: Install PostgreSQL server (Windows)
        run: |
          choco install postgresql16 --yes --no-progress --params "/Password:cortex"
          if ($LASTEXITCODE -ne 0) {
            choco install postgresql --yes --no-progress --params "/Password:cortex"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install PostgreSQL via Chocolatey."
            }
          }

          $service = Get-Service -Name "postgresql-x64-16" -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            $service = Get-Service -Name "postgresql-x64-*" -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -First 1
          }
          if ($null -eq $service) {
            $service = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -First 1
          }
          if ($null -eq $service) {
            throw "PostgreSQL Windows service not found after installation."
          }
          if ($service.Status -ne "Running") {
            Start-Service -Name $service.Name
          }
          Get-Service -Name $service.Name | Format-Table -AutoSize

      - name: Create local E2E database
        run: |
          $psql = Get-ChildItem "C:\Program Files\PostgreSQL\*\bin\psql.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($psql)) {
            throw "psql.exe was not found under C:\Program Files\PostgreSQL\*\bin."
          }

          $env:PGPASSWORD = "cortex"
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            & $psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc "SELECT 1;" *> $null
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            throw "PostgreSQL did not become ready on 127.0.0.1:5432."
          }

          $existsRaw = & $psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc "SELECT COUNT(*) FROM pg_database WHERE datname='cortexai';"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to check whether database cortexai exists."
          }

          $exists = ($existsRaw | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($exists)) {
            $exists = "0"
          }

          if ($exists -eq "0") {
            & $psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE cortexai;"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create database cortexai."
            }
          }

      - name: Initialize database schema
        run: |
          $psql = Get-ChildItem "C:\Program Files\PostgreSQL\*\bin\psql.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($psql)) {
            throw "psql.exe was not found under C:\Program Files\PostgreSQL\*\bin."
          }

          $env:PGPASSWORD = "cortex"
          & $psql -h 127.0.0.1 -p 5432 -U postgres -d cortexai -v ON_ERROR_STOP=1 -f "db/schema_public_snapshot.sql"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to apply db/schema_public_snapshot.sql."
          }

          Get-ChildItem "db/migrations/*.sql" | Sort-Object Name | ForEach-Object {
            & $psql -h 127.0.0.1 -p 5432 -U postgres -d cortexai -v ON_ERROR_STOP=1 -f $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to apply migration: $($_.Name)"
            }
          }

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: e2e

      - name: Run live E2E suite
        run: npm run test
        working-directory: e2e

      - name: Publish live E2E test report in GitHub Checks
        if: always() && hashFiles('e2e/test-results/junit.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Live E2E (Playwright)
          path: e2e/test-results/junit.xml
          reporter: java-junit
          fail-on-error: "false"

      - name: Add quick failure summary
        if: always()
        run: |
          @'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          report_path = Path("e2e/test-results/junit.xml")
          if not report_path.exists():
              summary_path.write_text("### Live E2E Summary\n\nJUnit report not found.\n", encoding="utf-8")
              raise SystemExit(0)

          root = ET.parse(report_path).getroot()
          suites = root.findall(".//testsuite")

          tests = 0
          failures = 0
          errors = 0
          skipped = 0
          failed_cases = []

          for suite in suites:
              tests += int(suite.attrib.get("tests", 0) or 0)
              failures += int(suite.attrib.get("failures", 0) or 0)
              errors += int(suite.attrib.get("errors", 0) or 0)
              skipped += int(suite.attrib.get("skipped", 0) or 0)

          for case in root.findall(".//testcase"):
              failed_node = case.find("failure") or case.find("error")
              if failed_node is None:
                  continue
              cls = case.attrib.get("classname", "")
              name = case.attrib.get("name", "")
              msg = (failed_node.attrib.get("message", "") or "").strip().splitlines()[0] if failed_node is not None else ""
              failed_cases.append((cls, name, msg))

          lines = [
              "### Live E2E Summary",
              "",
              f"- Total: **{tests}**",
              f"- Failed: **{failures + errors}**",
              f"- Skipped: **{skipped}**",
              "",
          ]

          if failed_cases:
              lines.append("#### First Failures")
              for cls, name, msg in failed_cases[:10]:
                  label = " / ".join([part for part in [cls, name] if part]).strip() or "Unnamed test"
                  if msg:
                      lines.append(f"- `{label}`: {msg}")
                  else:
                      lines.append(f"- `{label}`")
          else:
              lines.append("All tests passed.")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          '@ | python -

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.runtime
          if-no-files-found: ignore
