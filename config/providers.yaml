providers:
  - id: openai
    label: OpenAI
    api_key_env: OPENAI_API_KEY
    default_model_env: DEFAULT_OPENAI_MODEL
    default_model: gpt-4o
    compare_default_model: gpt-4.1-mini
    byok_supported: true
    capabilities: [chat, stream, compare, smart_routing, prompt_optimization]
    ui:
      display_name: ChatGPT
      icon_token: target
      logo_url: "https://www.google.com/s2/favicons?domain_url=openai.com&sz=64"
      color: "#10A37F"
      sort_order: 2

  - id: gemini
    label: Gemini
    api_key_env: GOOGLE_GEMINI_API_KEY
    default_model_env: DEFAULT_GEMINI_MODEL
    default_model: gemini-2.5-flash
    compare_default_model: gemini-2.5-flash-lite
    byok_supported: true
    capabilities: [chat, stream, compare, smart_routing, prompt_optimization]
    ui:
      display_name: Gemini
      icon_token: star
      logo_url: "https://www.google.com/s2/favicons?domain_url=gemini.google.com&sz=64"
      color: "#4285F4"
      sort_order: 1

  - id: deepseek
    label: DeepSeek
    api_key_env: DEEPSEEK_API_KEY
    default_model_env: DEFAULT_DEEPSEEK_MODEL
    default_model: deepseek-chat
    compare_default_model: deepseek-chat
    byok_supported: true
    capabilities: [chat, stream, compare, smart_routing, prompt_optimization]
    ui:
      display_name: DeepSeek
      icon_token: brain
      logo_url: "https://www.google.com/s2/favicons?domain_url=deepseek.com&sz=64"
      color: "#5B5BD6"
      sort_order: 3

  - id: grok
    label: Grok
    api_key_env: GROK_API_KEY
    default_model_env: DEFAULT_GROK_MODEL
    default_model: grok-4-latest
    compare_default_model: grok-4-1-fast-non-reasoning
    byok_supported: true
    capabilities: [chat, stream, compare, smart_routing, prompt_optimization]
    ui:
      display_name: Grok
      icon_token: robot
      logo_url: "https://www.google.com/s2/favicons?domain_url=x.ai&sz=64"
      color: "#1DA1F2"
      sort_order: 4

  - id: claude
    label: Claude
    api_key_env: ANTHROPIC_API_KEY
    default_model_env: DEFAULT_CLAUDE_MODEL
    default_model: claude-sonnet-4-5
    compare_default_model: claude-sonnet-4
    byok_supported: true
    capabilities: [chat, stream, compare, smart_routing, prompt_optimization]
    ui:
      display_name: Claude
      icon_token: target
      logo_url: "https://www.google.com/s2/favicons?domain_url=claude.ai&sz=64"
      color: "#D97706"
      sort_order: 5
