server {
    listen 80;
    server_name _;

    # Serve built React app from dist/
    root /home/ec2-user/cortex_6_23/frontend-react/dist;
    index index.html;

    # Hashed JS/CSS assets — cache forever (Vite changes the filename on each build)
    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API, auth callback, and runtime config → FastAPI
    location ~ ^/(v1|auth)(/|$) {
        proxy_pass http://172.31.24.113:5172;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    location = /runtime-config.js {
        proxy_pass http://172.31.24.113:5172;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # React Router — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
