<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CortexAI - One Gateway for Every Frontier Model</title>
    <meta
      name="description"
      content="Intelligently route, compare, and synthesize responses across OpenAI, Claude, Gemini, DeepSeek, and Grok — backed by transparent monthly AI credits."
    />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.amazonaws.com; img-src 'self' data: https:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("cortex-theme");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.colorScheme = theme;
          }
        } catch (error) {
          /* Theme still defaults to light when storage is unavailable. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main-landing.tsx"></script>
  </body>
</html>
