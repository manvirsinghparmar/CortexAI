name: Live E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: live-e2e
    env:
      E2E_LIVE_ENABLED: "true"
      E2E_LOAD_ROOT_DOTENV: "false"
      E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
      E2E_DATABASE_URL: postgresql+psycopg://postgres:cortex@127.0.0.1:5432/cortexai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install E2E dependencies
        run: npm install
        working-directory: e2e

      - name: Validate required live secrets
        run: |
          $required = @(
            "E2E_API_KEY",
            "OPENAI_API_KEY",
            "GOOGLE_GEMINI_API_KEY",
            "ANTHROPIC_API_KEY",
            "GROK_API_KEY",
            "DEEPSEEK_API_KEY"
          )

          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name" -ErrorAction SilentlyContinue).Value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error ("Missing required GitHub secrets: " + ($missing -join ", "))
            exit 1
          }

      - name: Install PostgreSQL server (Windows)
        run: |
          choco install postgresql16 --yes --no-progress --params "/Password:cortex"
          if ($LASTEXITCODE -ne 0) {
            choco install postgresql --yes --no-progress --params "/Password:cortex"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install PostgreSQL via Chocolatey."
            }
          }

          $service = Get-Service -Name "postgresql-x64-16" -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            $service = Get-Service -Name "postgresql-x64-*" -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -First 1
          }
          if ($null -eq $service) {
            $service = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -First 1
          }
          if ($null -eq $service) {
            throw "PostgreSQL Windows service not found after installation."
          }
          if ($service.Status -ne "Running") {
            Start-Service -Name $service.Name
          }
          Get-Service -Name $service.Name | Format-Table -AutoSize

      - name: Create local E2E database
        run: |
          $psql = Get-ChildItem "C:\Program Files\PostgreSQL\*\bin\psql.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($psql)) {
            throw "psql.exe was not found under C:\Program Files\PostgreSQL\*\bin."
          }

          $env:PGPASSWORD = "cortex"
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            & $psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc "SELECT 1;" *> $null
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            throw "PostgreSQL did not become ready on 127.0.0.1:5432."
          }

          $exists = (& $psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='cortexai';").Trim()
          if ($exists -ne "1") {
            & $psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE cortexai;"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create database cortexai."
            }
          }

      - name: Initialize database schema
        run: |
          @'
          import os
          from pathlib import Path

          import psycopg

          dsn = os.environ["E2E_DATABASE_URL"].strip()
          if dsn.startswith("postgresql+psycopg://"):
              dsn = "postgresql://" + dsn[len("postgresql+psycopg://") :]
          if dsn.startswith("postgres+psycopg://"):
              dsn = "postgres://" + dsn[len("postgres+psycopg://") :]

          schema_path = Path("db/schema_public_snapshot.sql")
          migration_dir = Path("db/migrations")
          migrations = sorted(migration_dir.glob("*.sql"))

          with psycopg.connect(dsn, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute(schema_path.read_text(encoding="utf-8"))
                  print(f"Applied schema: {schema_path}")
                  for migration in migrations:
                      cur.execute(migration.read_text(encoding="utf-8"))
                      print(f"Applied migration: {migration.name}")
          '@ | python -

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: e2e

      - name: Run live E2E suite
        run: npm run test
        working-directory: e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.runtime
          if-no-files-found: ignore
