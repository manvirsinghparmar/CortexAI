[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
  \.venv
  | venv
  | build
  | dist
  | htmlcov
  | tmp
  | \.pytest_cache
  | \.mypy_cache
)/
'''

[tool.ruff]
line-length = 100
exclude = [".venv", "venv", "build", "dist", "htmlcov", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "RUF"]
ignore = [
    "E402", # imports in entry points / tests
    "E731", # lambda assignment (orchestrator refactor later)
    "B008", # FastAPI Depends
    "RUF012", # ClassVar for config constants
    "RUF013", # implicit Optional
    "UP006", # legacy typing modernization deferred
    "UP034", # legacy style modernization deferred
    "UP035", # legacy typing modernization deferred
    "UP037", # quoted forward-reference modernization deferred
    "UP045", # X | None typing
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM110",
    "E501",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = false
check_untyped_defs = false
exclude = "(^\\.venv/|^venv/|^build/|^dist/|^htmlcov/|^tmp/|^tests/)"

[[tool.mypy.overrides]]
module = [
    "api.openai_client",
    "api.grok_client",
    "api.deepseek_client",
    "api.google_gemini_client",
    "orchestrator.core",
    "utils.prompt_optimizer",
    "db.repository",
]
ignore_errors = true
